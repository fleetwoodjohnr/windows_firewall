name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    # Server 2025 can build x64 artifacts; acceptance still needs Windows 11.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\verify-windows.ps1 -SyntaxOnly -Report "$env:RUNNER_TEMP\powershell-syntax.json"
      - name: Prepare Microsoft Defender for build downloads
        shell: powershell
        run: .\scripts\prepare-windows-runner.ps1
      - name: Select pinned Python
        id: build-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: python scripts/release.py --validate-tag
      - name: Verify dependencies, test and build installer
        shell: powershell
        env:
          BUILD_PYTHON: ${{ steps.build-python.outputs.python-path }}
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP\package-build.log"
          try {
            .\scripts\bootstrap.ps1 -BuildPython $env:BUILD_PYTHON
          } finally {
            Stop-Transcript
          }
      - name: Stage release assets
        shell: powershell
        run: |
          $version = (& .\.venv-build\Scripts\python.exe win_harden\version.py).Trim()
          if ($LASTEXITCODE) { throw 'Could not read the built version.' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath "installer\Output\WinHardenSetup-$version.exe" -Destination release-assets
          Copy-Item -LiteralPath "installer\Output\WinHardenSetup-$version.exe.sha256" -Destination release-assets
          Copy-Item -LiteralPath dist\win-harden\dependencies.json -Destination release-assets
      - name: Install, repair and uninstall the candidate
        shell: powershell
        run: |
          $setup = Get-ChildItem -LiteralPath release-assets -Filter '*.exe'
          if (@($setup).Count -ne 1) { throw 'Expected one candidate installer.' }
          .\scripts\verify-installer.ps1 -Installer $setup.FullName
      - name: Upload installer and dependency inventory
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: win-harden-windows-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-build-diagnostics
          path: |
            ${{ runner.temp }}/powershell-syntax.json
            ${{ runner.temp }}/package-build.log
            ${{ runner.temp }}/python-install.log
            ${{ runner.temp }}/installer-checks/*.log
            build/**/warn-*.txt
          if-no-files-found: warn
  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'fleetwoodjohnr/windows_firewall'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-win-harden
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: win-harden-windows-x64
          path: release-assets
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --artifacts release-assets
